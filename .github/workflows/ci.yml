name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # A fresh checkout is the guard for the "missing app/storage" class of bug.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests (LLM always mocked)
        run: pytest -m "not live"
      - name: Spec traceability
        run: python scripts/check_traceability.py
      - name: Smoke on sample datasets
        run: |
          python scripts/smoke_m0.py
          python scripts/smoke_m3.py

  # Spec 11 FR-DP-23 (AC-1, 5, 7, 15, 17): build both images, run the production compose
  # stack with the hosted limits and 512 MB, and drive it through the frontend only.
  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -f deploy/compose.yaml --env-file deploy/ci.env
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 300
      - name: Images run as non-root, backend image holds no tests or secrets (AC-1)
        run: |
          test "$($COMPOSE exec -T backend id -u)" != "0"
          test "$($COMPOSE exec -T frontend id -u)" != "0"
          $COMPOSE exec -T backend sh -c 'test ! -e /app/tests && test ! -e /app/.env && test ! -e /app/storage'
          ! $COMPOSE exec -T backend python -c "import pytest" 2>/dev/null
      - name: Smoke through the public entry point (AC-7, AC-15)
        run: python3 backend/scripts/smoke_deploy.py --base http://127.0.0.1:3000 --user ci --password ci-password --session-file /tmp/smoke_session
      - name: Backend refuses requests without the internal token
        run: |
          code=$($COMPOSE exec -T backend python -c "import urllib.request,urllib.error
          try: urllib.request.urlopen('http://127.0.0.1:8000/api/v1/config')
          except urllib.error.HTTPError as e: print(e.code)")
          test "$code" = "401"
      - name: Sessions survive a backend restart (AC-5)
        run: |
          $COMPOSE restart backend
          $COMPOSE up -d --wait --wait-timeout 120
          python3 backend/scripts/smoke_deploy.py --base http://127.0.0.1:3000 --user ci --password ci-password --session-file /tmp/smoke_session --check-session
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Stop
        if: always()
        run: $COMPOSE down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Component tests (Spec 04)
        run: npm test
      - name: Build
        run: npm run build
