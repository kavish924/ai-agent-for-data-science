# Spec 11 FR-DP-24..29: Render Blueprint, free tier, Singapore.
# Secrets are never stored here: INTERNAL_API_TOKEN is generated by Render; ACCESS_PASSWORD,
# GEMINI_API_KEY and BACKEND_URL are entered once in the dashboard (sync: false).
# Runbook: docs/deployment.md

envVarGroups:
  - name: ai-ds-agent-shared
    envVars:
      - key: INTERNAL_API_TOKEN # FR-DP-14/26: shared by both services
        generateValue: true

services:
  - type: web
    name: ai-ds-agent-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/ready
    numInstances: 1 # FR-DP-06: one process
    autoDeployTrigger: checksPass # FR-DP-27: deploy main only after CI passes
    envVars:
      - fromGroup: ai-ds-agent-shared
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_BACKEND
        value: aistudio
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_PERSISTENT # free tier: no disk (FR-DP-07)
        value: "false"
      - key: LOG_TO_FILE
        value: "false"
      - key: CORS_ORIGINS
        value: ""
      - key: DB_PATH
        value: /data/app.db
      - key: STORAGE_ROOT
        value: /data
      - key: MAX_FILE_SIZE_MB # FR-DP-20: fits 512 MB
        value: "5"
      - key: MAX_ROWS
        value: "20000"
      - key: MODEL_MAX_ROWS
        value: "10000"

  - type: web
    name: ai-ds-agent-frontend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: ai-ds-agent-shared
      - key: APP_ENV
        value: production
      - key: ACCESS_USER
        value: demo
      - key: ACCESS_PASSWORD
        sync: false
      - key: BACKEND_URL # the backend's https://…onrender.com URL, set after its first deploy
        sync: false
