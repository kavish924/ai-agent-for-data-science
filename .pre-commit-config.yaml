# Install once: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
        files: ^backend/
      - id: traceability
        name: spec traceability
        entry: python backend/scripts/check_traceability.py
        language: system
        pass_filenames: false
        files: ^(docs/specs/|backend/tests/)
